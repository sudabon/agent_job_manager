[project]
name = "agent-job-manager-backend"
version = "0.1.0"
description = "Backend for the Agent Job Manager MVP"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "arq>=0.26.0",
    "asyncpg>=0.30.0",
    "docker>=7.1.0",
    "fastapi>=0.116.0",
    "greenlet>=3.2.4",
    "pydantic-settings>=2.10.0",
    "python-ulid>=3.1.0",
    "sqlalchemy>=2.0.43",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "httpx>=0.28.0",
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
ignore = ["B008", "N818"]

[tool.mypy]
python_version = "3.13"
plugins = []
strict = true
packages = ["src"]

[[tool.mypy.overrides]]
module = ["docker"]
ignore_missing_imports = true
